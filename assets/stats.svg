<svg width="420" height="174" viewBox="0 0 420 174" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdalla Tawfig — GitHub Stats">
  <style>
    .t { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7C3AED }
    .k { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #C9D1D9 }
    .v { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #A78BFA }
    .s { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E }
    .in { opacity: 0; animation: fade .5s ease-in-out forwards }
    @keyframes fade { to { opacity: 1 } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="173" rx="10" fill="#0D1117" stroke="#21262D"/>
  <text x="25" y="34" class="t">Abdalla Tawfig — GitHub Stats</text>
  <g class="in" style="animation-delay:150ms">
    <circle cx="30" cy="62" r="3" fill="#7C3AED"/>
    <text x="44" y="66" class="k">Contributions (last year)</text>
    <text x="395" y="66" class="v" text-anchor="end">33</text>
  </g>
  <g class="in" style="animation-delay:220ms">
    <circle cx="30" cy="88" r="3" fill="#7C3AED"/>
    <text x="44" y="92" class="k">Public Repositories</text>
    <text x="395" y="92" class="v" text-anchor="end">18</text>
  </g>
  <g class="in" style="animation-delay:290ms">
    <circle cx="30" cy="114" r="3" fill="#7C3AED"/>
    <text x="44" y="118" class="k">Total Stars Earned</text>
    <text x="395" y="118" class="v" text-anchor="end">5</text>
  </g>
  <g class="in" style="animation-delay:360ms">
    <circle cx="30" cy="140" r="3" fill="#7C3AED"/>
    <text x="44" y="144" class="k">Followers</text>
    <text x="395" y="144" class="v" text-anchor="end">3</text>
  </g>
</svg>