<svg width="420" height="166" viewBox="0 0 420 166" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Most Used Languages">
  <style>
    .t { font: 600 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #7C3AED }
    .k { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #C9D1D9 }
    .v { font: 700 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #A78BFA }
    .s { font: 400 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8B949E }
    .in { opacity: 0; animation: fade .5s ease-in-out forwards }
    @keyframes fade { to { opacity: 1 } }
  </style>
  <rect x="0.5" y="0.5" width="419" height="165" rx="10" fill="#0D1117" stroke="#21262D"/>
  <text x="25" y="34" class="t">Most Used Languages</text>
  <clipPath id="round"><rect x="25" y="56" width="370" height="10" rx="5"/></clipPath>
  <g clip-path="url(#round)">
    <rect x="25" y="56" width="370" height="10" fill="#21262D"/>
    <rect x="25.0" y="56" width="246.5" height="10" fill="#A97BFF"/>
    <rect x="271.5" y="56" width="66.9" height="10" fill="#00B4AB"/>
    <rect x="338.4" y="56" width="15.0" height="10" fill="#3178c6"/>
    <rect x="353.3" y="56" width="14.1" height="10" fill="#f1e05a"/>
    <rect x="367.4" y="56" width="11.8" height="10" fill="#e34c26"/>
    <rect x="379.2" y="56" width="9.3" height="10" fill="#b07219"/>
  </g>
  <g class="in" style="animation-delay:200ms">
    <circle cx="30" cy="98" r="5" fill="#A97BFF"/>
    <text x="43" y="102" class="k">Kotlin</text>
    <text x="180" y="102" class="s" text-anchor="end">66.6%</text>
  </g>
  <g class="in" style="animation-delay:270ms">
    <circle cx="215" cy="98" r="5" fill="#00B4AB"/>
    <text x="228" y="102" class="k">Dart</text>
    <text x="365" y="102" class="s" text-anchor="end">18.1%</text>
  </g>
  <g class="in" style="animation-delay:340ms">
    <circle cx="30" cy="122" r="5" fill="#3178c6"/>
    <text x="43" y="126" class="k">TypeScript</text>
    <text x="180" y="126" class="s" text-anchor="end">4.0%</text>
  </g>
  <g class="in" style="animation-delay:410ms">
    <circle cx="215" cy="122" r="5" fill="#f1e05a"/>
    <text x="228" y="126" class="k">JavaScript</text>
    <text x="365" y="126" class="s" text-anchor="end">3.8%</text>
  </g>
  <g class="in" style="animation-delay:480ms">
    <circle cx="30" cy="146" r="5" fill="#e34c26"/>
    <text x="43" y="150" class="k">HTML</text>
    <text x="180" y="150" class="s" text-anchor="end">3.2%</text>
  </g>
  <g class="in" style="animation-delay:550ms">
    <circle cx="215" cy="146" r="5" fill="#b07219"/>
    <text x="228" y="150" class="k">Java</text>
    <text x="365" y="150" class="s" text-anchor="end">2.5%</text>
  </g>
</svg>